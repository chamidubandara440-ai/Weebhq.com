name: google-indexing

on:
  push:
    paths:
      - 'content/news/**.md'
      - 'content/reviews/**.md'
      - 'content/articles/latest-anime-recommendations/**.md'
  workflow_dispatch:

jobs:
  notify-google:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install google-auth google-auth-httplib2 httplib2

      - name: Ping Google Indexing API for new articles
        env:
          GOOGLE_INDEXING_SA_JSON: ${{ secrets.GOOGLE_INDEXING_SA_JSON }}
        run: |
          python3 - <<'PYEOF'
          import os, json, subprocess, sys, urllib.request, urllib.error

          BASE_URL = "https://weebhq.com"
          INDEXING_ENDPOINT = "https://indexing.googleapis.com/v3/urlNotifications:publish"

          sa_json = os.environ.get("GOOGLE_INDEXING_SA_JSON", "")
          if not sa_json:
              print("GOOGLE_INDEXING_SA_JSON not set. Skipping.")
              sys.exit(0)

          # Get changed files from last commit
          result = subprocess.run(
              ["git", "diff", "--name-only", "HEAD~1", "HEAD"],
              capture_output=True, text=True
          )
          changed = result.stdout.strip().splitlines()
          print(f"Changed files: {changed}")

          urls = []
          for f in changed:
              if f.startswith("content/news/") and f.endswith(".md"):
                  slug = f.replace("content/news/","").replace(".md","")
                  urls.append(f"{BASE_URL}/news/{slug}")
              elif f.startswith("content/reviews/") and f.endswith(".md"):
                  slug = f.replace("content/reviews/","").replace(".md","")
                  urls.append(f"{BASE_URL}/reviews/{slug}")
              elif f.startswith("content/articles/latest-anime-recommendations/") and f.endswith(".md"):
                  slug = f.replace("content/articles/latest-anime-recommendations/","").replace(".md","")
                  urls.append(f"{BASE_URL}/articles/latest-anime-recommendations/{slug}")

          if not urls:
              print("No new article URLs to index.")
              sys.exit(0)

          print(f"URLs to index: {urls}")

          try:
              from google.oauth2 import service_account
              import google.auth.transport.requests

              sa_info = json.loads(sa_json)
              credentials = service_account.Credentials.from_service_account_info(
                  sa_info, scopes=["https://www.googleapis.com/auth/indexing"]
              )
              auth_req = google.auth.transport.requests.Request()
              credentials.refresh(auth_req)
              token = credentials.token
          except Exception as e:
              print(f"Auth failed: {e}")
              sys.exit(1)

          headers = {
              "Authorization": f"Bearer {token}",
              "Content-Type": "application/json",
          }
          for url in urls:
              payload = json.dumps({"url": url, "type": "URL_UPDATED"}).encode()
              req = urllib.request.Request(INDEXING_ENDPOINT, data=payload, headers=headers, method="POST")
              try:
                  resp = urllib.request.urlopen(req, timeout=15)
                  print(f"[OK] Indexed: {url} -> HTTP {resp.status}")
              except urllib.error.HTTPError as e:
                  body = e.read().decode()[:200]
                  print(f"[FAIL] {url} -> {e.code}: {body}")
              except Exception as e:
                  print(f"[ERROR] {url} -> {e}")
          PYEOF