name: Daily AI News Automation

on:
  schedule:
    - cron: "0 0 * * *" # Runs every day at midnight UTC
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  run-ai-agent:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to push back to the repo
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Run AI Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/ai-agent.js

      - name: Commit and Push changes
        run: |
          git config --global user.name "WeebHQ AI Bot"
          git config --global user.email "bot@weebhq.com"
          git add data/db.json
          git commit -m "Auto-update: Generated new AI anime news" || echo "No changes to commit"
          git push
