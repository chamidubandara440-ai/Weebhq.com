name: WeebHQ Build Verify

# This workflow validates that the Next.js build succeeds after every push.
# Cloudflare Pages handles the actual deployment automatically on push to main.
# Do NOT add GitHub Pages deployment here - weebhq.com uses Cloudflare Pages.

on:
  push:
    branches:
      - main
    paths:
      - 'content/**'
      - 'src/**'
      - 'public/**'
      - 'next.config.mjs'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

concurrency:
  group: build-verify
  cancel-in-progress: true

jobs:
  build-verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js static export
        run: npm run build
        env:
          NODE_ENV: production

      - name: Verify news articles in output
        run: |
          echo "=== News pages in out/ ==="
          find out/ -path "*/news/*" -name "*.html" | sort
          echo "=== Total static pages ==="
          find out/ -name "*.html" | wc -l